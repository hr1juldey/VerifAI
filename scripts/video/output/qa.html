<!DOCTYPE html>
<html>
<head>
<title>VerifAI Video QA Frames</title>
<style>
body { background: #111; color: #fff; font-family: monospace; }
h1 { text-align: center; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
.frame { border: 2px solid #333; padding: 10px; }
.frame img { width: 100%; height: auto; }
.frame .label { text-align: center; padding: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<h1>VerifAI Video QA — 12 Key Frames</h1>
<div class="grid">
<div class="frame"><img src="qa_frames/00_start.jpg"><div class="label">0s — Start</div></div>
<div class="frame"><img src="qa_frames/01_hero_anim.jpg"><div class="label">10s — Hero Animation</div></div>
<div class="frame"><img src="qa_frames/02_hero_end.jpg"><div class="label">28s — Hero End</div></div>
<div class="frame"><img src="qa_frames/03_pain_start.jpg"><div class="label">35s — Pain Section Start</div></div>
<div class="frame"><img src="qa_frames/04_pain_stats.jpg"><div class="label">55s — Pain Stats</div></div>
<div class="frame"><img src="qa_frames/05_pain_end.jpg"><div class="label">80s — Pain End</div></div>
<div class="frame"><img src="qa_frames/06_tech.jpg"><div class="label">100s — Tech Section</div></div>
<div class="frame"><img src="qa_frames/07_tech_tags.jpg"><div class="label">120s — Tech Tags</div></div>
<div class="frame"><img src="qa_frames/08_insight.jpg"><div class="label">150s — I-JEPA Insight</div></div>
<div class="frame"><img src="qa_frames/09_demo_start.jpg"><div class="label">185s — Demo Start</div></div>
<div class="frame"><img src="qa_frames/10_demo_verify.jpg"><div class="label">195s — Demo Verify</div></div>
<div class="frame"><img src="qa_frames/11_close.jpg"><div class="label">210s — Close</div></div>
</div>
</body>
</html>
